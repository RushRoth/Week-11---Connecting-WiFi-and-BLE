; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wifi_example

[env:adafruit_feather_esp32s3_reversetft]
platform = espressif32
board = adafruit_feather_esp32s3_reversetft
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.2
build_src_filter = +<*> -<wifi_example.cpp> -<ble_example.cpp>

[env:ble_example]
extends = env:adafruit_feather_esp32s3_reversetft
build_src_filter = +<*> -<main.cpp> -<wifi_example.cpp>

[env:wifi_example]
extends = env:adafruit_feather_esp32s3_reversetft
build_src_filter = +<wifi_example.cpp>
monitor_dtr = 1
monitor_rts = 0
